[project]
name = "grid-intake-check"
version = "0.1.0"
description = "Pre-ingest QA for utility power-grid data: readiness score, topology and attribute checks, GIS-to-LiDAR reconciliation, library mapping and a customer data request."
readme = "README.md"
license = "MIT"
authors = [{ name = "Dmytro Mazurev" }]
requires-python = ">=3.11"
keywords = ["gis", "power-grid", "digital-twin", "data-quality", "lidar", "utilities", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "shapely>=2.0",
  "pyproj>=3.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "grid-intake-check[api,mcp]"]

[project.scripts]
gridintake = "gridintake.cli:main"

[project.urls]
Repository = "https://github.com/dmytromazurev/grid-intake-check"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridintake"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
